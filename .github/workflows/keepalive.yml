name: System Maintenance Keepalive

on:
  schedule:
    - cron: "0 0 */5 * *"   # every 5 days at midnight UTC
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  ping:
    name: Ping maintenance endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call /api/system-maintenance
        run: |
          RESPONSE=$(curl --silent --show-error --write-out "\n__STATUS__%{http_code}" \
            --request GET \
            --header "Authorization: Bearer ${{ secrets.KEEP_ALIVE_TOKEN }}" \
            "${{ secrets.SITE_URL }}/api/system-maintenance")

          BODY=$(echo "$RESPONSE" | sed '/^__STATUS__/d')
          STATUS=$(echo "$RESPONSE" | grep "^__STATUS__" | sed 's/__STATUS__//')

          echo "--- Response body ---"
          echo "$BODY"
          echo "--- HTTP status: $STATUS ---"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Maintenance endpoint returned HTTP $STATUS (expected 200)"
            exit 1
          fi
