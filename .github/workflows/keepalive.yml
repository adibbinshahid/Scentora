name: System Maintenance Keepalive

on:
  schedule:
    - cron: "0 0 */5 * *"   # every 5 days at midnight UTC
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  ping:
    name: Ping maintenance endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call /api/system-maintenance (verbose)
        run: |
          curl -v -L \
            --request GET \
            --header "Authorization: Bearer ${{ secrets.KEEP_ALIVE_TOKEN }}" \
            "${{ secrets.SITE_URL }}/api/system-maintenance"
